name: Atualizar catálogos CAPES
on:
  push:
    paths:
      - '.github/workflows/atualizar-catalogo.yml'
      - 'scripts/importar_springer.py'
      - 'scripts/importar_wiley.py'
      - 'scripts/importar_elsevier.py'
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * 1'
permissions:
  contents: write
jobs:
  catalogo-springer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor de planilhas
        run: pip install openpyxl==3.1.5 pdfplumber==0.11.4
      - name: Baixar e validar catálogo oficial Springer
        run: python scripts/importar_springer.py
      - name: Baixar e validar catálogo oficial Wiley
        continue-on-error: true
        run: python scripts/importar_wiley.py
      - name: Ler contrato oficial Elsevier 57/2025
        continue-on-error: true
        run: python scripts/importar_elsevier.py
      - name: Registrar atualização no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catálogo Springer oficial"
            git push
          fi
